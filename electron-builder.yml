appId: dev.lucas.pullwave
productName: Pullwave
artifactName: pullwave-${version}.${ext}
directories:
  output: dist
publish:
  provider: github
  owner: monothread
  repo: pullwave
files:
  - out/**/*
  - package.json
  - resources/icon.png
icon: resources/icon.png
linux:
  extraResources:
    - from: resources/ani-scripts
      to: ani-scripts
    - from: resources/THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
  target:
    - AppImage
  category: Network
  syncDesktopName: true
win:
  extraResources:
    - from: resources/ani-scripts
      to: ani-scripts
    - from: resources/THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
  target:
    - target: nsis
      arch: x64
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: pullwave-${version}-setup.${ext}
  deleteAppDataOnUninstall: false
