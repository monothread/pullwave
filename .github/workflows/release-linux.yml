name: Release Linux

# Builds the Linux package (the AppImage) and attaches it, with latest-linux.yml, to the draft GitHub Release of the
# version in package.json. Use it instead of `npm run release` when you do not want to build locally.
# Run it manually from the Actions tab, before publishing the draft Release. Do not mix it with a local
# `npm run release` of the same version: both upload latest-linux.yml and the last one wins.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check, lint and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build the AppImage and upload it to the draft Release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the AppImage as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.blockmap
